name: Build Vivilo Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "vivilo-source.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivilo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and unpack Android source
        run: |
          test -s vivilo-source.zip
          unzip -q vivilo-source.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36-ext1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        working-directory: source
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          APK="$(find source/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/vivilo.apk
          sha256sum dist/vivilo.apk > dist/vivilo.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivilo-android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish tagged APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: vivilo-android-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vivilo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/vivilo.apk
            dist/vivilo.apk.sha256
