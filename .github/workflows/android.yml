name: Build Vivilo Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Vivilo-GitHub-Actions-Ready.zip"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivilo-android-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and unpack Android source
        run: |
          test -s Vivilo-GitHub-Actions-Ready.zip
          unzip -q Vivilo-GitHub-Actions-Ready.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Apply verified Kotlin compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/src/main/java/com/vivilo/media/ui/screens/PlayerScreen.kt")
          s = p.read_text(encoding="utf-8")
          old_import = "import androidx.compose.foundation.gestures.detectTapGestures"
          new_import = old_import + chr(10) + "import androidx.compose.foundation.gestures.detectVerticalDragGestures"
          if "import androidx.compose.foundation.gestures.detectVerticalDragGestures" not in s:
              if old_import not in s:
                  raise SystemExit("Could not locate Compose gesture imports")
              s = s.replace(old_import, new_import, 1)
          old_call = "androidx.compose.foundation.gestures.detectVerticalDragGestures("
          if old_call not in s:
              raise SystemExit("Expected broken vertical-drag call was not found")
          s = s.replace(old_call, "detectVerticalDragGestures(", 1)
          p.write_text(s, encoding="utf-8")
          print("Patched PlayerScreen.kt: imported and invoked detectVerticalDragGestures correctly")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        working-directory: source
        run: gradle :app:assembleDebug --no-daemon

      - name: Run unit tests
        working-directory: source
        timeout-minutes: 10
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          APK="$(find source/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/vivilo.apk
          sha256sum dist/vivilo.apk > dist/vivilo.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivilo-android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish tagged APK release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: vivilo-android-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'Vivilo Latest' || format('Vivilo {0}', github.ref_name) }}
          tag_name: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: |
            dist/vivilo.apk
            dist/vivilo.apk.sha256
